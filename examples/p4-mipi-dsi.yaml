# Optional fragment for existing ESP32-P4 ESP-IDF firmware with PSRAM, network
# connectivity and an RGB565 LVGL instance whose ID is ui.
# The application keeps its display provider. Composed direct video needs
# the advertised public MIPI readback capability; this fragment adds no driver.
# This file is a package fragment, not a complete board/network configuration.
external_components:
  - source:
      type: git
      url: https://github.com/n-IA-hane/esphome-screenshot
      ref: dev
      path: esphome/components
    components: [esp_screenshot]

esp_screenshot:
  id: screen_capture
  lvgl_id: ui
  rotation: 0
  path: screen
  quality: 85
  max_jpeg_size: 262144
  capture_id:
    name: Screenshot ID
  capture_status:
    name: Screenshot status

packages:
  screenshot: !include ../packages/screenshot.yaml
