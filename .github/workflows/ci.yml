name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      component_manifest:
        description: Exact Intercom coordinated-sources.json (blank follows dev/main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - name: Test configuration, code generation and production host contracts
        run: python -m pytest -q --junitxml=test-results/host.xml
      - name: Preserve host results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-host-results
          path: test-results/host.xml
          if-no-files-found: error

  firmware:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install esphome==2026.10.0
      - name: Compile and link one standalone ESP32-S3 LVGL firmware
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          nice -n 10 python -m esphome compile examples/lvgl-s3.yaml 2>&1 | tee test-results/lvgl-s3.log
      - name: Preserve SDK smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-sdk-result
          path: test-results/lvgl-s3.log
          if-no-files-found: error

  mipi-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install the coordinated official Core for real MIPI code generation
        run: python -m pip install "esphome @ git+https://github.com/esphome/esphome.git@373224c141dceadbb67ace263040cbfc802c5968" pytest==9.0.3 PyYAML==6.0.3
      - name: Select only the hardware-provider bootstrap ref
        id: bootstrap
        env:
          COMPONENT_MANIFEST: ${{ inputs.component_manifest }}
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !(endsWith(github.ref_name, '-dev') || contains(github.ref_name, '-dev.')))) && 'main' || 'dev' }}
        run: |
          python - <<'PYCODE'
          import json, os, re
          raw = os.environ.get("COMPONENT_MANIFEST", "").strip()
          ref = os.environ["COMPONENT_REF"]
          if raw:
              ref = json.loads(raw)["backend_sha"]
              assert re.fullmatch(r"[0-9a-f]{40}", ref)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("backend_ref=" + ref + "\n")
          PYCODE
      - name: Fetch the public MIPI capability and authoritative source validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-intercom
          ref: ${{ steps.bootstrap.outputs.backend_ref }}
          path: .test-deps/esphome-intercom
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /esphome/components/mipi_dsi/
            /scripts/coordinated_sources.py
            /qualification/sources.json
      - name: Validate the complete coordinated manifest with its existing owner
        env:
          COMPONENT_MANIFEST: ${{ inputs.component_manifest }}
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !(endsWith(github.ref_name, '-dev') || contains(github.ref_name, '-dev.')))) && 'main' || 'dev' }}
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import importlib.util, json, os, subprocess
          backend = Path(".test-deps/esphome-intercom")
          spec = importlib.util.spec_from_file_location("coordinated", backend / "scripts/coordinated_sources.py")
          owner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owner)
          raw = os.environ.get("COMPONENT_MANIFEST", "").strip()
          manifest = json.loads(raw) if raw else None
          owner.requested_refs(manifest, os.environ["COMPONENT_REF"])
          owner.requested_repositories(manifest, os.environ["COMPONENT_REF"])
          commit = lambda root: subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
          actual = {"backend_sha": commit(backend), "screenshot_sha": commit(Path.cwd())}
          if manifest is not None:
              assert manifest["backend_sha"] == actual["backend_sha"]
              assert manifest["components"]["esphome-screenshot"]["sha"] == actual["screenshot_sha"]
          Path("test-results").mkdir(exist_ok=True)
          Path("test-results/mipi-source-selection.json").write_text(json.dumps(actual, indent=2) + "\n")
          PYCODE
      - name: Execute all four real provider code-generation cases
        env:
          ESP_SCREENSHOT_MIPI_SOURCE: ${{ github.workspace }}/.test-deps/esphome-intercom/esphome/components
        run: |
          python -m pytest -q tests/test_esp_screenshot_mipi.py::test_mipi_owner_capability_real_schema_codegen --junitxml=test-results/mipi-codegen.xml
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          cases = ET.parse("test-results/mipi-codegen.xml").getroot().findall(".//testcase")
          assert len(cases) == 4
          assert not any(case.find("skipped") is not None for case in cases)
          PYCODE
      - name: Preserve the actual source and executed MIPI cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-mipi-codegen-results
          path: |
            test-results/mipi-codegen.xml
            test-results/mipi-source-selection.json
          if-no-files-found: error
