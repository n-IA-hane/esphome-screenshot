name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - name: Test configuration, code generation and production host contracts
        run: python -m pytest -q --junitxml=test-results/host.xml
      - name: Preserve host results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-host-results
          path: test-results/host.xml
          if-no-files-found: error

  firmware:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - run: python -m pip install esphome==2026.10.0
      - name: Compile and link one standalone ESP32-S3 LVGL firmware
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          nice -n 10 python -m esphome compile examples/lvgl-s3.yaml 2>&1 | tee test-results/lvgl-s3.log
      - name: Preserve SDK smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-sdk-result
          path: test-results/lvgl-s3.log
          if-no-files-found: error
